[package]
name = "neohtop"
version = "1.2.0"
description = "A cross-platform system monitor"
authors = ["you"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2", features = ["macos-private-api"] }
sysinfo = { version = "0.39", features = ["component", "disk", "multithread", "network", "system"] }
tauri-plugin-shell = "2"
tauri-plugin-os = "2"
listeners = "0.6"
window-vibrancy = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = "0.3.2"
objc2-io-kit = { version = "0.3.2", features = ["libc"] }

[features]
default = [ "custom-protocol" ]
custom-protocol = [ "tauri/custom-protocol" ]

[profile.release]
panic = "abort"            # Strip expensive panic clean-up logic
codegen-units = 1          # Compile crates one after another so the compiler can optimize better
lto = "fat"                # More aggressive link-time optimization
opt-level = 3              # Optimize for maximum performance
strip = true               # Remove debug symbols
incremental = false         # Disable incremental compilation
