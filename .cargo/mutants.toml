# cargo-mutants scope for gtop. Run `sh scripts/mutants-diff.sh` for changed code.
# Only domain logic is mutated: collectors' pure parsing, state, history, disk scan,
# search, sorting, and number formatting. GPUI views, FFI shells, and test code are out.

exclude_globs = [
  "tests/**", # Integration test sources are not product behavior.
  "**/tests/**", # Nested test fixtures and modules are not product behavior.
  "**/tests.rs", # Out-of-line test modules are not product behavior.
  "**/*_tests.rs", # Dedicated test helpers are not product behavior.
  "crates/gtop/src/test_data.rs", # Process and display fixtures are test helpers.
  "crates/gtop/src/draw_benchmark.rs", # Drawing benchmark helpers are not product behavior.
  "crates/gtop/src/screenshots.rs", # Snapshot helpers are not product behavior.
  "tools/history-bench/**", # Benchmark helper binary is not product behavior.
]

examine_globs = [
  "crates/gtop-core/src/lib.rs",
  "crates/gtop-core/src/state.rs",
  "crates/gtop-core/src/monitoring/native_processes.rs",
  "crates/gtop-core/src/monitoring/process_monitor.rs",
  "crates/gtop-core/src/monitoring/port_monitor.rs",
  "crates/gtop-core/src/monitoring/system_monitor.rs",
  "crates/gtop-core/src/monitoring/battery.rs",
  "crates/gtop-core/src/monitoring/smc.rs",
  "crates/gtop-core/src/monitoring/iokit.rs",
  "crates/gtop-core/src/monitoring/temperature_monitor.rs",
  "crates/gtop/src/analysis.rs",
  "crates/gtop/src/column_widths.rs",
  "crates/gtop/src/model.rs",
  "crates/gtop/src/now_json.rs",
  "crates/gtop/src/history.rs",
  "crates/gtop/src/history/store.rs",
  "crates/gtop/src/disk_scan.rs",
  "crates/gtop/src/disk_scan/queue.rs",
  "crates/gtop/src/perf.rs",
]

exclude_re = [
  # GPUI element builders are drawing glue; width calculations and event behavior remain in scope.
  'column_widths.rs:.*(cell|handle|handle_left|pin_to_edge)',
  # Sends real signals; a mutant could reach pid <= 1. Never mutate the kill path.
  'signal_target_is_safe',
  'ProcessMonitor::kill_process',
  'AppState::kill_process',
  # Test code: a mutated test helper can turn a child pid into -1 (gsource sent
  # kill(-1, SIGKILL) that way). Never mutate test modules or test files.
  'replace tests::',
  ' in tests::',
  '_tests\.rs:',
  '/tests/',
  # FFI shells: they call IOKit, SMC, or libproc and need real hardware.
  # Only their Drop impls release kernel handles; other Drop impls stay in scope.
  "iokit.rs.*read_battery",
  '(iokit|smc)\.rs.*<impl Drop for ',
  "iokit.rs.*(Object::|Accelerator::(all|name|stats|gpu_time_per_process|number)|StorageDrivers::)",
  "smc.rs.*GpuTemperature::",
  "temperature_monitor.rs.*TemperatureMonitor::collect",
  # Reads the host's sysctl and ioreg output; the parsers it feeds are tested. The
  # non-macOS variant is not compiled on macOS.
  "lib\\.rs.*replace CpuTopology::detect -> Self with Default::default\\(\\)",
  # Equivalent: the banks are checked to be disjoint first, so | and ^ agree.
  "lib\\.rs.*replace \\| with \\^ in CpuTopology::complete",
  # Caches the process environment in a OnceLock; perf_requested holds the parse.
  "lib\\.rs.*replace perf_enabled -> bool with ",
  # Default calls new, which calls this again. Every frame reads the user list, so
  # the recursion only ever times out; no caller can observe another result.
  "state\\.rs.*replace AppState::with_process_monitor -> Self with Default::default\\(\\)",
  # Test-only hooks that force the permission-denied path; release builds drop them.
  "process_monitor\\.rs.*replace ProcessMonitor::deny_identity with \\(\\)",
  "native_processes\\.rs.*replace == with != in Collector::read_bsd_info",
  # Equivalent: a larger first buffer lists the same PIDs, only with more slack.
  "native_processes\\.rs.*replace \\+ with \\* in list_pids",
]

# The gtop test binary links GPUI. A cold build in a fresh copy takes minutes.
build_timeout_multiplier = 4.0
timeout_multiplier = 3.0
minimum_test_timeout = 60
