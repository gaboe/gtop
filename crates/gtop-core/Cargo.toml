[package]
name = "gtop-core"
version = "1.2.0"
edition = "2021"
license = "MIT"

[dependencies]
listeners = "0.6"
serde = { version = "1.0", features = ["derive", "rc"] }
sysinfo = { version = "0.39", features = ["component", "disk", "multithread", "network", "system"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = "0.3.2"
objc2-io-kit = { version = "0.3.2", features = ["libc"] }
