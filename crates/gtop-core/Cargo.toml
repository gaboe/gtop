[package]
name = "gtop-core"
version = "1.2.0"
edition = "2021"
license = "MIT"
description = "System monitoring collectors for gtop"
repository = "https://github.com/gaboe/gtop"
homepage = "https://github.com/gaboe/gtop"
readme = "../../README.md"
keywords = ["macos", "monitor", "process", "system"]
categories = ["os::macos-apis", "visualization"]
rust-version = "1.99.1"

[dependencies]
listeners = "0.6"
serde = { version = "1.0", features = ["derive", "rc"] }
sysinfo = { version = "0.39", features = ["component", "disk", "network", "system"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
sysinfo = { version = "0.39", features = ["multithread"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2-core-foundation = "0.3.2"
objc2-io-kit = { version = "0.3.2", features = ["libc"] }
