[package]
name = "gtop-disk"
version = "1.2.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"
description = "Vendored disk scanning and treemap domain for gtop"
repository = "https://github.com/gaboe/gtop"

[dependencies]
rayon = "1"
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
sysinfo = { version = "0.39", default-features = false, features = ["system"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["fs"] }

[dev-dependencies]
tempfile = "3"
