[package]
name = "gtop"
version = "1.2.0"
edition = "2021"
license = "MIT"

[dependencies]
gtop-core = { path = "../gtop-core" }
gpui = { package = "gpui-pre", version = "=0.3.9" }
gpui-component = "=0.8.0"
gpui-platform = { package = "gpui-pre-platform", version = "=0.3.9", features = ["runtime_shaders", "font-kit"] }
gpui-kit-assets = "=0.8.0"
futures = "0.3"
regex = "1"
