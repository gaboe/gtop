[package]
name = "gtop"
version = "1.2.0"
edition = "2021"
license = "MIT"

[features]
history-benchmark = []
history-profile = []

[dependencies]
gtop-core = { path = "../gtop-core" }
gpui = { package = "gpui-pre", version = "=0.3.9", features = ["profiler"] }
gpui-component = "=0.8.0"
gpui-platform = { package = "gpui-pre-platform", version = "=0.3.9", features = ["runtime_shaders", "font-kit"] }
gpui-kit-assets = "=0.8.0"
futures = "0.3"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
libc = "0.2"
objc2-foundation = { version = "0.3.2", features = ["NSFileManager", "NSURL", "NSString", "NSError"] }
ttf-parser = "=0.25.1"
resvg = { version = "=0.46.0", default-features = false }
image = { version = "=0.25.10", default-features = false }
rusqlite = { version = "=0.41.0", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"
gpui = { package = "gpui-pre", version = "=0.3.9", features = ["test-support"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(gtop_draw_benchmark)'] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui-apple = { package = "gpui-pre-apple", version = "=0.3.9", features = ["font-kit"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["NSApplication", "NSWindow"] }
