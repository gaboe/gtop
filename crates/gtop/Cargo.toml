[package]
name = "gtop"
version = "1.2.0"
edition = "2021"
license = "MIT"

[features]
history-benchmark = []

[dependencies]
gtop-core = { path = "../gtop-core" }
gpui = { package = "gpui-pre", version = "=0.3.9", features = ["profiler"] }
gpui-component = "=0.8.0"
gpui-platform = { package = "gpui-pre-platform", version = "=0.3.9", features = ["runtime_shaders", "font-kit"] }
gpui-kit-assets = "=0.8.0"
futures = "0.3"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
rusqlite = { version = "=0.41.0", features = ["bundled"] }

[dev-dependencies]
gpui = { package = "gpui-pre", version = "=0.3.9", features = ["test-support"] }
ttf-parser = "=0.25.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(gtop_draw_benchmark)'] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui-apple = { package = "gpui-pre-apple", version = "=0.3.9", features = ["font-kit"] }
