[package]
name = "gtop-history-bench"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[features]
default = ["history-benchmark"]
history-benchmark = []
history-profile = []

[dependencies]
gtop-core = { path = "../../crates/gtop-core" }
rusqlite = { version = "=0.41.0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = "fat"
opt-level = 3
strip = true
incremental = false

[[bin]]
name = "gtop-history-bench"
path = "src/main.rs"
test = false
